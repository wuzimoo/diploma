services:
  - type: web
    name: baupilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://baupilot-demo.vercel.app,https://newdesign.baupilot-demo.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: baupilot-db
          property: connectionString
databases:
  - name: baupilot-db
    databaseName: baupilot
    user: baupilot_user
    plan: free
    region: frankfurt
